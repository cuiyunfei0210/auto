name: Build client app

on:
  push:
    branches: [main, "cursor/random-org-cli-8480"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build executable
        run: python -m PyInstaller --noconfirm random_org_gui.spec
      - name: Stage delivery folder
        shell: bash
        run: |
          mkdir -p delivery
          cp packaging/客户使用说明.txt delivery/
          if [ -f dist/RandomNumberGenerator.exe ]; then
            cp dist/RandomNumberGenerator.exe delivery/
          else
            cp dist/RandomNumberGenerator delivery/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ runner.os }}
          path: delivery/
