name: Build client app

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest -q

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller and app
        run: python -m pip install --upgrade pip pyinstaller && python -m pip install -e .
      - name: Build executable
        run: python -m PyInstaller --noconfirm wallpaper_studio.spec
      - name: Copy Windows CRT next to python312.dll
        if: runner.os == 'Windows'
        run: python packaging/windows_runtime.py dist/WallpaperStudio
      - name: Confirm Windows Python runtime is bundled
        if: runner.os == 'Windows'
        shell: python
        run: |
          from pathlib import Path
          folder = Path("dist/WallpaperStudio/_internal")
          app = Path("dist/WallpaperStudio")
          exe = app / "WallpaperStudio.exe"
          py = folder / "python312.dll"
          assert exe.is_file(), exe
          assert py.is_file() and py.stat().st_size >= 1_000_000, (py, py.stat().st_size if py.is_file() else 0)
          pyds = {path.name.lower() for path in folder.glob("*.pyd")}
          dlls = {path.name.lower() for path in folder.glob("*.dll")}
          beside = {path.name.lower() for path in app.glob("*.dll")}
          missing = [name for name in ("_socket.pyd", "select.pyd") if name not in pyds]
          assert not missing, (missing, "pyds", sorted(pyds)[:80], "dlls", sorted(dlls)[:40])
          for name in ("vcruntime140.dll", "vcruntime140_1.dll"):
              assert name in dlls or name in beside, (name, sorted(dlls)[:40], sorted(beside)[:40])
          chrome = list(folder.rglob("chrome.exe")) + list(folder.rglob("chrome-headless-shell.exe"))
          assert not chrome, ("do not bundle Chromium; Windows uses system Edge", chrome[:3])
      - name: Smoke-test Windows exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) "dist/WallpaperStudio/WallpaperStudio.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--no-browser" -PassThru
          $ok = $false
          try {
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/health
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
              if ($proc.HasExited) { break }
            }
            if (-not $ok) {
              Get-ChildItem "dist/WallpaperStudio/_internal" -Filter *.pyd | Select-Object -ExpandProperty Name
              if ($proc.HasExited) { throw "WallpaperStudio.exe exited with code $($proc.ExitCode) before /api/health" }
              throw "WallpaperStudio.exe did not answer /api/health"
            }
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Stage delivery folder
        shell: bash
        run: |
          mkdir -p delivery
          cp packaging/exe-readme.txt delivery/使用说明.txt || cp packaging/exe-readme.txt delivery/
          if [ -d dist/WallpaperStudio ]; then
            cp -R dist/WallpaperStudio delivery/WallpaperStudio
            cp packaging/open-studio.bat delivery/WallpaperStudio/打开壁纸工坊.bat || true
          elif [ -f dist/WallpaperStudio.exe ]; then
            cp dist/WallpaperStudio.exe delivery/
          else
            cp dist/WallpaperStudio delivery/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ runner.os }}
          path: delivery/
          include-hidden-files: true
