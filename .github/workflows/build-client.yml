name: Build client app

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest -q

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows portable app
        if: runner.os == 'Windows'
        run: python packaging/build_windows_embed.py
      - name: Install PyInstaller and app
        if: runner.os != 'Windows'
        run: python -m pip install --upgrade pip pyinstaller && python -m pip install -e .
      - name: Build Unix executable
        if: runner.os != 'Windows'
        run: python -m PyInstaller --noconfirm wallpaper_studio.spec
      - name: Confirm Windows Python runtime is bundled
        if: runner.os == 'Windows'
        shell: python
        run: |
          from pathlib import Path
          app = Path("dist/WallpaperStudio")
          exe = app / "WallpaperStudio.exe"
          py = app / "python312.dll"
          pythonw = app / "pythonw.exe"
          assert exe.is_file(), exe
          assert pythonw.is_file(), pythonw
          assert (app / "run.py").is_file(), app
          assert py.is_file() and py.stat().st_size >= 1_000_000, (py, py.stat().st_size if py.is_file() else 0)
          dlls = {path.name.lower() for path in app.glob("*.dll")}
          assert "vcruntime140.dll" in dlls, sorted(dlls)[:40]
          chrome = list(app.rglob("chrome.exe")) + list(app.rglob("chrome-headless-shell.exe"))
          assert not chrome, ("do not bundle Chromium; Windows uses system Edge", chrome[:3])
          assert not (app / "_internal" / "python312.dll").exists()
      - name: Smoke-test Windows exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) "dist/WallpaperStudio/WallpaperStudio.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--no-browser" -PassThru
          $ok = $false
          try {
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/health
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
              if ($proc.HasExited -and $proc.ExitCode -ne 0) { break }
            }
            if (-not $ok) {
              Get-ChildItem "dist/WallpaperStudio" -Filter python*.dll | Select-Object Name, Length
              if ($proc.HasExited) { throw "WallpaperStudio.exe exited with code $($proc.ExitCode) before /api/health" }
              throw "WallpaperStudio.exe did not answer /api/health"
            }
          } finally {
            if ($proc -and -not $proc.HasExited) { taskkill /PID $proc.Id /T /F | Out-Null }
          }

      - name: Stage delivery folder
        shell: bash
        run: |
          mkdir -p delivery
          cp packaging/exe-readme.txt delivery/使用说明.txt || cp packaging/exe-readme.txt delivery/
          if [ -d dist/WallpaperStudio ]; then
            cp -R dist/WallpaperStudio delivery/WallpaperStudio
            cp packaging/open-studio.bat delivery/WallpaperStudio/打开壁纸工坊.bat || true
          elif [ -f dist/WallpaperStudio.exe ]; then
            cp dist/WallpaperStudio.exe delivery/
          else
            cp dist/WallpaperStudio delivery/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ runner.os }}
          path: delivery/
          include-hidden-files: true
