[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wallpaper-studio"
version = "0.1.0"
description = "Desktop helper that remixes wallpapers and uploads them one account at a time."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "playwright>=1.48.0",
  "pillow>=10.4.0",
  "pydantic>=2.9.0",
  "python-multipart>=0.0.9",
  "pywebview>=5.1",
  "pythonnet>=3.0.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
wallpaper-studio = "wallpaper_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wallpaper_studio = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
